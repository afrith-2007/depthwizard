<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0A1410; }
    .slide-container { 
      width: 1280px; min-height: 720px; 
      background: #0A1410; 
      display: flex; 
      flex-direction: row;
      padding: 48px;
      position: relative;
      color: #F0F5F2;
      font-family: 'Manrope', sans-serif;
    }
    .motif {
      position: absolute;
      top: 48px;
      right: 48px;
      font-family: 'JetBrains Mono', monospace;
      color: #1E382C;
      font-size: 24px;
    }
    .left-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-top: 48px;
    }
    .right-col {
      width: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .hero-graphic {
      width: 100%;
      height: 500px;
      border: 1px solid #1E382C;
      background: #12211A;
      position: relative;
      overflow: hidden;
    }
    .hero-graphic::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(45deg, transparent, transparent 20px, rgba(204, 255, 0, 0.05) 21px);
    }
    .hero-graphic::after {
      content: "DEPTH_MAP_01";
      position: absolute;
      bottom: 12px;
      left: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: #8A9C92;
    }
    .wireframe-box {
      position: absolute;
      width: 80%;
      height: 60%;
      border: 1px solid #CCFF00;
      opacity: 0.4;
    }
    .title {
      font-size: 56px;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.04em;
      margin-bottom: 24px;
    }
    .subtitle {
      font-size: 24px;
      color: #8A9C92;
      max-width: 500px;
      line-height: 1.4;
    }
    .label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      color: #CCFF00;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .page-num {
      position: absolute;
      bottom: 48px;
      right: 48px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      color: #8A9C92;
    }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="motif">+</div>
    <div class="left-col">
      <div class="label">Project / DepthWizard</div>
      <h1 class="title">From one image<br>to a measurable<br><span style="color: #CCFF00;">world.</span></h1>
      <p class="subtitle">Upgrading single-view depth estimation into a cinematic spatial reconstruction studio.</p>
    </div>
    <div class="right-col">
      <div class="hero-graphic">
        <div class="wireframe-box" style="top: 10%; left: 10%;"></div>
        <div class="wireframe-box" style="top: 20%; left: 20%; border-color: #00E5FF;"></div>
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #CCFF00; font-size: 80px; opacity: 0.2;">∿</div>
      </div>
    </div>
    <div class="page-num">01</div>
  </div>
</body>
</html>
