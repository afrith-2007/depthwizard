<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0A1410; }
    .slide-container { 
      width: 1280px; min-height: 720px; 
      background: #0A1410; 
      display: flex; 
      flex-direction: column;
      padding: 48px;
      position: relative;
      color: #F0F5F2;
      font-family: 'Manrope', sans-serif;
    }
    .motif { position: absolute; top: 48px; right: 48px; font-family: 'JetBrains Mono', monospace; color: #1E382C; font-size: 24px; }
    .header { padding-top: 48px; margin-bottom: 32px; }
    .title { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px; }
    .label { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #CCFF00; text-transform: uppercase; letter-spacing: 0.1em; }
    .viewport-mockup {
      flex: 1;
      border: 1px solid #1E382C;
      background: #12211A;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .viewport-ui {
      position: absolute;
      inset: 0;
      pointer-events: none;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .ui-block {
      background: rgba(10, 20, 16, 0.8);
      border: 1px solid #1E382C;
      padding: 12px 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      width: fit-content;
    }
    .crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      border: 1px solid rgba(204, 255, 0, 0.3);
      border-radius: 50%;
    }
    .crosshair::before, .crosshair::after {
      content: "";
      position: absolute;
      background: #CCFF00;
      opacity: 0.5;
    }
    .crosshair::before { width: 60px; height: 1px; left: -10px; top: 19px; }
    .crosshair::after { height: 60px; width: 1px; left: 19px; top: -10px; }
    .feature-list {
      position: absolute;
      right: 24px;
      top: 100px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .feature-tag {
      background: #0A1410;
      border-left: 2px solid #CCFF00;
      padding: 8px 16px;
      font-size: 14px;
      color: #F0F5F2;
    }
    .page-num { position: absolute; bottom: 48px; right: 48px; font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #8A9C92; }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="motif">+</div>
    <div class="header">
      <div class="label">Interaction / Viewport</div>
      <h2 class="title">A cinematic flythrough, not a static result</h2>
    </div>
    <div class="viewport-mockup">
      <div style="position: absolute; inset: 0; background: radial-gradient(circle at center, #1E382C 0%, #0A1410 70%); opacity: 0.3;"></div>
      <div class="crosshair"></div>
      <div class="viewport-ui">
        <div class="flex justify-between">
          <div class="ui-block">POSE: AZ 042° / EL 18°</div>
          <div class="ui-block" style="color: #CCFF00;">SCALE: 1.00× CALIBRATED</div>
        </div>
        <div class="ui-block">NAV: DRAG ORBIT / W-S DOLLY</div>
      </div>
      <div class="feature-list">
        <div class="feature-tag">Cinematic Camera Controls</div>
        <div class="feature-tag">Variable Point Size (0.008–0.08)</div>
        <div class="feature-tag">Points / Wireframe Display Modes</div>
        <div class="feature-tag">Depth Field Visualization</div>
      </div>
    </div>
    <div class="page-num">04</div>
  </div>
</body>
</html>
